*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--font-ui);

  var mob = r.mobiles, land = r.landline ? [r.landline] : [];
  R.push({id:'s'+r.n, tab:'sec', num:r.n, name:r.name, kind:r.type, people:people.map(function(x){return {role:x[0],name:x[1],phones:[]}}),
    blocks:[mob.length?{lab:'mobile',ph:mob}:null, land.length?{lab:'fixe',ph:land}:null, r.email?{lab:'mail',mail:r.email}:null].filter(Boolean),
    hay:norm([r.name,r.director,r.nazer,r.q1,r.q2,r.email].join(' ')+' '+mob.concat(land).join(' ')), digits:mob.concat(land).join(' ')});
});
D.primary.forEach(function(r){
  var people=[];
  if(r.director) people.push({role:'dir',name:r.director,phones:r.phones}); else if(r.phones.length) people.push({role:'dir',name:'',phones:r.phones});
  if(r.assistant||r.assistantPhones.length) people.push({role:'asst',name:r.assistant,phones:r.assistantPhones});
  var allp=r.phones.concat(r.assistantPhones);
  R.push({id:'p'+r.deleg+r.n, tab:'pri', num:r.n, name:r.school, deleg:r.deleg, kind:'', people:people, blocks:[], note:r.note,
    hay:norm([r.school,r.director,r.assistant,r.deleg,r.note].join(' ')+' '+allp.join(' ')), digits:allp.join(' ')});
});
D.privatePrimary.forEach(function(r,i){
  R.push({id:'v'+i, tab:'priv', num:i+1, name:r.name, kind:'private', sub:'primPriv', people:[], blocks:[{lab:'tel',ph:r.phones},{lab:'addr',text:r.address}],
    hay:norm(r.name+' '+r.address)+' '+r.phones.join(' '), digits:r.phones.join(' ')});
});
D.preschool.forEach(function(r,i){
  R.push({id:'w'+i, tab:'priv', num:D.privatePrimary.length+i+1, name:r.name, kind:'private', sub:'preschool', people:[], blocks:[{lab:'tel',ph:r.phones},{lab:'addr',text:r.address}],
    hay:norm(r.name+' '+r.address)+' '+r.phones.join(' '), digits:r.phones.join(' ')});
});
D.inspection.forEach(function(r,i){
  var ppl = r.clerk ? [{role:'clerk',name:r.clerk,phones:r.clerkPhones}] : [];
  R.push({id:'i'+i, tab:'insp', num:i+1, name:r.name, deleg:r.deleg, kind:'', people:ppl, blocks:[{lab:'tel',ph:[r.phone]}],
    hay:norm(r.name+' '+r.deleg+' '+r.clerk)+' '+r.phone+' '+r.clerkPhones.join(' '), digits:r.phone+' '+r.clerkPhones.join(' ')});
});

var TABS=['sec','pri','priv','insp'];
var DELEGS=['صفاقس الجنوبية','ساقية الداير','ساقية الزيت','الحنشة','منزل شاكر','جبنيانة','العامرة','قرقنة'];
var KINDS=['college','lycee','private'];

/* ---------- filtering ---------- */
function matchQ(r,q){
  if(!q) return true;
  var nq=norm(q), dq=q.replace(/\s/g,'');
  var parts=nq.split(' ');
  return parts.every(function(p){
    if(/^\d+$/.test(p)) return r.digits.replace(/\s/g,' ').indexOf(p)>-1 || r.digits.replace(/ /g,'').indexOf(p)>-1;
    return r.hay.indexOf(p)>-1;
  });
}
function inChip(r){
  if(S.f==='all') return true;
  if(r.tab==='sec') return r.kind===S.f;
  if(r.tab==='pri'||r.tab==='insp') return r.deleg===S.f;
  return true;
}
function visible(){
  return R.filter(function(r){return r.tab===S.tab && matchQ(r,S.q) && inChip(r) && (!S.fav||favs[r.id])});
}

/* ---------- rendering ---------- */
var el=function(id){return document.getElementById(id)};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var ICON_COPY='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>';
var ICON_STAR='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>';

function phoneHtml(p){
  var ok=/^\d{8}$/.test(p);
  var shown=esc(fmt(p));
  var inner = ok ? '<a href="tel:+216'+p+'">'+shown+'</a>' : '<span class="t">'+shown+'</span>';
  return '<span class="ph'+(ok?'':' odd')+'"'+(ok?'':' title="'+esc(t().odd)+'"')+'>'+inner+
    '<button class="cp" type="button" data-copy="'+esc(p)+'" aria-label="'+esc(t().copy+' '+fmt(p))+'">'+ICON_COPY+'</button></span>';
}
function rowHtml(lab,html){return '<li class="row"><span class="lab">'+esc(lab)+'</span><div class="val">'+html+'</div></li>'}

function cardText(r){
  var L=[r.name];
  r.people.forEach(function(p){L.push(t()[p.role]+': '+p.name+(p.phones.length?' ('+p.phones.map(fmt).join(' / ')+')':''))});
  r.blocks.forEach(function(b){ if(b.ph) L.push(t()[b.lab]+': '+b.ph.map(fmt).join(' / ')); else if(b.mail) L.push(t().mail+': '+b.mail); else L.push(t()[b.lab]+': '+b.text)});
  return L.join('\n');
}

function cardHtml(r){
  var tags='';
  if(r.kind) tags+='<span class="tag '+r.kind+'">'+esc(t()[r.kind])+'</span>';
  if(r.sub) tags+='<span class="tag">'+esc(t()[r.sub])+'</span>';
  if(r.deleg){var fr=t().deleg[r.deleg]; tags+='<span class="tag">'+(r.tab==='insp'?esc(t().circ)+' · ':'')+esc(fr?fr+' · '+r.deleg:r.deleg)+'</span>'}
  if(r.note) tags+='<span class="tag warn" lang="ar" dir="rtl">'+esc(r.note)+'</span>';
  var rows='';
  r.people.forEach(function(p){
    var h='';
    if(p.name) h+='<span class="pname" lang="ar" dir="rtl">'+esc(p.name)+'</span>';
    if(p.phones.length) h+='<span class="phs">'+p.phones.map(phoneHtml).join('')+'</span>';
    rows+=rowHtml(t()[p.role],h);
  });
  r.blocks.forEach(function(b){
    if(b.ph) rows+=rowHtml(t()[b.lab],'<span class="phs">'+b.ph.map(phoneHtml).join('')+'</span>');
    else if(b.mail) rows+=rowHtml(t().mail,'<span class="mail"><span>'+esc(b.mail)+'</span><button class="cp ph" style="border:1px solid var(--line);border-radius:8px;padding:4px 7px" type="button" data-copy="'+esc(b.mail)+'" aria-label="'+esc(t().copy)+'">'+ICON_COPY+'</button></span>');
    else rows+=rowHtml(t()[b.lab],'<span class="addr" lang="ar" dir="rtl">'+esc(b.text)+'</span>');
  });
  var on=!!favs[r.id];
  return '<article class="card" data-id="'+r.id+'"><div class="ch"><span class="num">'+r.num+'</span><h3 lang="ar" dir="rtl">'+esc(r.name)+'</h3>'+
    '<button class="star" type="button" aria-pressed="'+on+'" aria-label="'+esc(t().fav)+'">'+ICON_STAR+'</button></div>'+
    (tags?'<div class="tags">'+tags+'</div>':'')+'<ul class="rows">'+rows+'</ul>'+
    '<div class="foot"><button class="copyall" type="button" data-card="'+r.id+'">'+esc(t().copyCard)+'</button></div></article>';
}

function renderChips(){
  var h='', box=el('chips');
  function chip(val,label,count){return '<button class="chip" type="button" data-f="'+val+'" aria-pressed="'+(S.f===val)+'">'+label+(count!=null?'<span class="c">'+count+'</span>':'')+'</button>'}
  var base=R.filter(function(r){return r.tab===S.tab && matchQ(r,S.q)});
  if(S.tab==='sec'){
    h+=chip('all',esc(t().all),base.length);
    KINDS.forEach(function(k){h+=chip(k,esc(t()[k]),base.filter(function(r){return r.kind===k}).length)});
  } else if(S.tab==='pri'||S.tab==='insp'){
    h+=chip('all',esc(t().all),base.length);
    DELEGS.forEach(function(d){
      var n=base.filter(function(r){return r.deleg===d}).length;
      if(S.tab==='insp' && !R.some(function(r){return r.tab==='insp'&&r.deleg===d})) return;
      var fr=t().deleg[d];
      h+=chip(d,(fr?'<small>'+esc(fr)+'</small> ':'')+'<span lang="ar">'+esc(d)+'</span>',n);
    });
  }
  box.innerHTML=h; box.hidden=!h;
}

function renderTabs(){
  el('tabs').innerHTML=TABS.map(function(k){
    var n=R.filter(function(r){return r.tab===k && matchQ(r,S.q)}).length;
    return '<button class="tab" role="tab" type="button" data-tab="'+k+'" aria-selected="'+(S.tab===k)+'">'+esc(t().tabs[k])+'<span class="n'+(n?'':' zero')+'">'+n+'</span></button>';
  }).join('');
}

function render(){
  var L=t();
  document.documentElement.lang=S.lang; document.documentElement.dir=S.lang==='ar'?'rtl':'ltr';
  el('h1').textContent=L.title; el('sub').textContent=L.sub; el('q').placeholder=L.ph;
  el('lang').textContent=L.lang;
  var dark = S.theme==='dark' || (S.theme!=='light' && matchMedia('(prefers-color-scheme: dark)').matches);
  el('theme').textContent = dark ? L.light : L.dark;
  el('favbtn').innerHTML='★ '+esc(L.fav)+' <span class="c">'+Object.keys(favs).filter(function(k){return favs[k]}).length+'</span>';
  el('favbtn').setAttribute('aria-pressed',S.fav);
  el('clr').hidden=!S.q;
  renderTabs(); renderChips();
  var list=visible();
  el('count').textContent=L.results(list.length);
  var g=el('grid');
  if(list.length){ g.innerHTML=list.map(cardHtml).join(''); }
  else g.innerHTML='<div class="empty" style="grid-column:1/-1"><b>'+esc(L.none)+'</b>'+esc(L.noneSub)+'<br><button class="chip" type="button" id="rst">'+esc(L.reset)+'</button></div>';
  // hint: hits in other tabs
  var hint=el('hint');
  if(S.q && !list.length){
    var others=TABS.filter(function(k){return k!==S.tab}).map(function(k){return [k,R.filter(function(r){return r.tab===k&&matchQ(r,S.q)}).length]}).filter(function(x){return x[1]});
    if(others.length){hint.innerHTML=esc(L.elsewhere)+' '+others.map(function(x){return '<button type="button" data-tab="'+x[0]+'">'+esc(L.tabs[x[0]])+' ('+x[1]+')</button>'}).join(' · ');hint.hidden=false}
    else hint.hidden=true;
  } else hint.hidden=true;
  el('note').innerHTML='<span>'+esc(L.src1)+'</span><span>'+esc(L.src2)+'</span>';
}

/* ---------- actions ---------- */
var toastT;
function toast(msg){var e=el('toast');e.textContent=msg;e.classList.add('on');clearTimeout(toastT);toastT=setTimeout(function(){e.classList.remove('on')},1400)}
function copy(text){
  var done=function(){toast(t().copied)};
  function fallback(){
    var ta=document.createElement('textarea');ta.value=text;ta.setAttribute('readonly','');ta.style.cssText='position:fixed;opacity:0;top:0';
    document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done()}catch(e){}document.body.removeChild(ta);
  }
  try{ navigator.clipboard.writeText(text).then(done,fallback) }catch(e){ fallback() }
}
function setTab(k){S.tab=k;S.f='all';try{history.replaceState(null,'','#'+{sec:'secondaire',pri:'primaire',priv:'prive',insp:'inspections'}[k])}catch(e){};render();}

document.addEventListener('click',function(e){
  var b=e.target.closest('button'); if(!b) return;
  if(b.dataset.copy){copy(b.dataset.copy);return}
  if(b.dataset.card){var r=R.filter(function(x){return x.id===b.dataset.card})[0];copy(cardText(r));return}
  if(b.dataset.tab){setTab(b.dataset.tab);return}
  if(b.dataset.f){S.f=b.dataset.f;render();return}
  if(b.classList.contains('star')){var id=b.closest('.card').dataset.id;favs[id]=!favs[id];if(!favs[id])delete favs[id];lsSet('sfx2-favs',JSON.stringify(favs));
    if(S.fav)render();else{b.setAttribute('aria-pressed',!!favs[id]);el('favbtn').innerHTML='★ '+esc(t().fav)+' <span class="c">'+Object.keys(favs).length+'</span>'}return}
  if(b.id==='favbtn'){S.fav=!S.fav;render();return}
  if(b.id==='clr'){S.q='';el('q').value='';render();el('q').focus();return}
  if(b.id==='rst'){S.q='';S.f='all';S.fav=false;el('q').value='';render();return}
  if(b.id==='lang'){S.lang=S.lang==='fr'?'ar':'fr';lsSet('sfx2-lang',S.lang);render();return}
  if(b.id==='theme'){var dark=document.documentElement.dataset.theme==='dark'||(!document.documentElement.dataset.theme&&matchMedia('(prefers-color-scheme: dark)').matches);
    S.theme=dark?'light':'dark';document.documentElement.dataset.theme=S.theme;lsSet('sfx2-theme',S.theme);render();return}
});
var qt;
el('q').addEventListener('input',function(e){clearTimeout(qt);var v=e.target.value;qt=setTimeout(function(){S.q=v;S.f='all';render()},90)});

/* ---------- boot ---------- */
if(S.theme==='dark'||S.theme==='light') document.documentElement.dataset.theme=S.theme;
var h=(location.hash||'').slice(1), map={secondaire:'sec',primaire:'pri',prive:'priv',inspections:'insp'};
if(map[h]) S.tab=map[h];
window.addEventListener('hashchange',function(){var m=map[(location.hash||'').slice(1)];if(m&&m!==S.tab){S.tab=m;S.f='all';render()}});
render();
})();
</script>

</body></html>
