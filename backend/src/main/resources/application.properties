
# ==========================================
# APPLICATION
# ==========================================
spring.application.name=annuaire-scolaire-api
server.port=8080

# ==========================================
# DATABASE - MYSQL 
# ==========================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/annuaire_scolaire}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA / HIBERNATE
# ==========================================

# IMPORTANT : ne jamais créer ou modifier automatiquement
# les tables de la base existante.
spring.jpa.hibernate.ddl-auto=validate

spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Africa/Tunis

# ==========================================
# SQL INITIALIZATION
# ==========================================
spring.sql.init.mode=never

# ==========================================
# ACTUATOR
# ==========================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# ==========================================
# SWAGGER / OPENAPI
# ==========================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ==========================================
# JSON
# ==========================================
spring.jackson.serialization.write-dates-as-timestamps=false





